<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../_shared/fonts/fonts.css">
<link rel="stylesheet" href="../../_shared/shared.css">
<style>
  /* 07 Keynote minimal — the studio's Premium Dark: black canvas, lit chrome type, one coral light (DESIGN.md §07) */
  .stage { background: #000; }
  .cam { position: absolute; inset: 0; }
  .grid { position: absolute; left: -400px; right: -400px; top: 1100px; height: 1200px; transform: perspective(900px) rotateX(64deg); transform-origin: 50% 0;
    background-image: linear-gradient(rgba(255,255,255,.07) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.07) 2px, transparent 2px);
    background-size: 120px 120px; -webkit-mask: linear-gradient(#000 0%, transparent 70%); }
  .chrome { background: linear-gradient(180deg, #FFFFFF 0%, #D9D9D9 45%, #8A8A8A 60%, #F2F2F2 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #t1 { position: absolute; left: 0; right: 0; top: 330px; text-align: center; font: 800 150px/1.05 "Kanit"; }
  #t2 { position: absolute; left: 0; right: 0; top: 520px; text-align: center; font: 600 60px/1.2 "Kanit"; color: #9A9A9A; }
  #orb { position: absolute; left: 390px; top: 760px; width: 300px; height: 300px; }
  #orb .halo { position: absolute; inset: -160px; border-radius: 50%; background: radial-gradient(circle, rgba(217,119,87,.55) 0%, rgba(217,119,87,.12) 40%, transparent 70%); }
  #orb svg { position: absolute; inset: 0; }
  #card { position: absolute; left: 130px; right: 130px; top: 1220px; padding: 50px 56px; border-radius: 36px;
    background: rgba(255,255,255,.06); border: 1.5px solid rgba(255,255,255,.18); box-shadow: 0 0 0 1px rgba(217,119,87,0) inset, 0 40px 120px rgba(0,0,0,.6); }
  #card small { display: block; font: 700 24px "Inter"; letter-spacing: .22em; color: #D97757; margin-bottom: 18px; }
  #card div { font: 700 70px/1.3 "Kanit"; color: #F2F2F2; }
  #card b { color: #D97757; font-weight: 800; }
  .cross { position: absolute; width: 26px; height: 26px; }
  .cross::before, .cross::after { content: ""; position: absolute; background: rgba(255,255,255,.35); }
  .cross::before { left: 12px; top: 0; width: 2px; height: 26px; } .cross::after { top: 12px; left: 0; height: 2px; width: 26px; }
  #sweep { position: absolute; top: 300px; left: -300px; width: 220px; height: 420px; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent); transform: skewX(-20deg); mix-blend-mode: overlay; }
</style>
</head>
<body>
<div class="stage" data-composition-id="s07" data-start="0" data-duration="6" data-width="1080" data-height="1920">
  <div class="cam">
    <div class="grid"></div>
    <div class="cross" style="left:96px;top:200px"></div><div class="cross" style="right:96px;top:200px"></div>
    <div class="cross" style="left:96px;top:1720px"></div><div class="cross" style="right:96px;top:1720px"></div>
    <div id="t1" class="chrome">AI เขียนโน้ต</div>
    <div id="t2">ถึงตัวเองในอนาคต</div>
    <div id="sweep"></div>
    <div id="orb"><div class="halo"></div>
      <svg viewBox="-150 -150 300 300"><g id="burst" fill="#D97757">
        <path d="M0 -130 L 14 -14 L 130 0 L 14 14 L 0 130 L -14 14 L -130 0 L -14 -14 Z"/>
        <path d="M0 -90 L 10 -10 L 90 0 L 10 10 L 0 90 L -10 10 L -90 0 L -10 -10 Z" transform="rotate(45)"/></g></svg>
    </div>
    <div id="card"><small>NOTE TO FUTURE SELF</small><div>บอกความจริง<br><b>เฉพาะตอนถูกถาม</b></div></div>
  </div>
  <div class="label"><b>07</b>Keynote minimal · Premium Dark</div>
</div>
<script src="../../_shared/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  tl.from("#t1", { scale: 1.18, opacity: 0, filter: "blur(16px)", duration: 0.9, ease: "power3.out" }, 0.15);
  tl.from("#t2", { y: 24, opacity: 0, duration: 0.6, ease: "power2.out" }, 0.75);
  tl.fromTo("#sweep", { x: 0 }, { x: 1500, duration: 0.9, ease: "power2.inOut" }, 1.0);
  tl.from("#orb", { scale: 0, rotation: -90, duration: 0.8, ease: "back.out(1.7)" }, 1.6);
  tl.from("#orb .halo", { opacity: 0, scale: 0.5, duration: 1.0, ease: "sine.out" }, 1.7);
  tl.to("#burst", { rotation: 90, transformOrigin: "50% 50%", duration: 4.0, ease: "none" }, 2.0);
  tl.from("#card", { y: 120, opacity: 0, scale: 0.96, duration: 0.8, ease: "expo.out" }, 2.8);
  tl.to("#card", { boxShadow: "0 0 0 2px rgba(217,119,87,.9) inset, 0 0 90px rgba(217,119,87,.35)", duration: 0.6, ease: "sine.inOut" }, 4.3);
  tl.to("#orb .halo", { scale: 1.15, opacity: 0.8, duration: 1.0, yoyo: true, repeat: 1, ease: "sine.inOut" }, 3.6);
  // camera never sleeps: slow push-in, grid recedes
  tl.fromTo(".cam", { scale: 1 }, { scale: 1.06, duration: 6, ease: "none" }, 0);
  tl.fromTo(".grid", { backgroundPositionY: 0 }, { backgroundPositionY: 240, duration: 6, ease: "none" }, 0);
  tl.to({}, { duration: 6 }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["s07"] = tl;
</script>
</body>
</html>
