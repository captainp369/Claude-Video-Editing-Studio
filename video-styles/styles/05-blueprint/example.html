<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../_shared/fonts/fonts.css">
<link rel="stylesheet" href="../../_shared/shared.css">
<style>
  /* 05 Blueprint — white linework on blue, dimension lines, one yellow note (DESIGN.md §05) */
  .stage { background: #0E3B6E; }
  .cam { position: absolute; inset: -60px; }
  .grid { position: absolute; inset: 0;
    background-image: linear-gradient(rgba(127,179,255,.22) 2px, transparent 2px), linear-gradient(90deg, rgba(127,179,255,.22) 2px, transparent 2px),
                      linear-gradient(rgba(127,179,255,.1) 1px, transparent 1px), linear-gradient(90deg, rgba(127,179,255,.1) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; background-position: 60px 60px; }
  .t { position: absolute; font-family: "Bai Jamjuree"; color: #E8F1FF; white-space: nowrap; }
  #t1 { left: 150px; top: 300px; font-size: 128px; font-weight: 700; letter-spacing: .02em; }
  #t2 { left: 150px; top: 470px; font-size: 64px; font-weight: 600; }
  .mono { position: absolute; font: 600 26px "IBM Plex Mono"; color: #BFD8FF; letter-spacing: .08em; white-space: nowrap; }
  svg.lay { position: absolute; left: 60px; top: 60px; width: 1080px; height: 1920px; overflow: visible; }
  svg .s { fill: none; stroke: #E8F1FF; stroke-width: 4; stroke-linecap: square; }
  svg .f { fill: none; stroke: #7FB3FF; stroke-width: 2.5; stroke-dasharray: 10 8; }
  #note { position: absolute; left: 210px; top: 1420px; width: 780px; padding: 34px 40px; border: 4px solid #FFCF5C; background: rgba(255,207,92,.1);
    font: 700 66px/1.35 "Bai Jamjuree"; color: #FFCF5C; }
  #note small { display: block; font: 600 24px "IBM Plex Mono"; letter-spacing: .14em; color: #FFCF5C; margin-bottom: 10px; }
  #stamp { position: absolute; right: 120px; top: 1290px; border: 3px solid #E8F1FF; padding: 10px 18px; font: 600 24px "IBM Plex Mono"; color: #E8F1FF; letter-spacing: .1em; }
</style>
</head>
<body>
<div class="stage" data-composition-id="s05" data-start="0" data-duration="6" data-width="1080" data-height="1920">
  <div class="cam">
    <div class="grid"></div>
    <div class="t" id="t1">AI เขียนโน้ต</div>
    <div class="t" id="t2">ถึงตัวเองในอนาคต</div>
    <svg class="lay" viewBox="0 0 1080 1920">
      <!-- title dimension line -->
      <path class="s d" d="M150 640 L 930 640"/><path class="s d" d="M150 625 L 150 655 M930 625 L 930 655"/>
      <!-- robot elevation -->
      <rect class="s d" x="400" y="760" width="300" height="230" rx="30"/>
      <circle class="s d" cx="490" cy="860" r="34"/><circle class="s d" cx="610" cy="860" r="34"/>
      <path class="s d" d="M550 760 L 550 700"/><circle class="s d" cx="550" cy="686" r="14"/>
      <rect class="s d" x="440" y="1010" width="220" height="200" rx="10"/>
      <path class="f d" d="M550 680 L 550 1230"/>
      <!-- dimensions + leaders -->
      <path class="s d" d="M360 760 L 360 1210 M345 760 L 375 760 M345 1210 L 375 1210"/>
      <path class="s d" d="M610 860 L 820 780 L 960 780"/>
      <path class="s d" d="M660 1110 L 820 1110 L 820 1400"/>
    </svg>
    <div class="mono" id="m1" style="left:150px;top:670px">W 780 · AI-NOTE / REV.A</div>
    <div class="mono" id="m2" style="left:250px;top:965px;transform:rotate(-90deg);transform-origin:left top">H 450</div>
    <div class="mono" id="m3" style="left:830px;top:740px">SENSOR</div>
    <div class="mono" id="m4" style="left:830px;top:1070px">MEMORY 200K</div>
    <div id="stamp">DWG 05</div>
    <div id="note"><small>NOTE-01 · TO FUTURE SELF</small>บอกความจริง<br>เฉพาะตอนถูกถาม</div>
  </div>
  <div class="label"><b>05</b>Blueprint</div>
</div>
<script src="../../_shared/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  const d = [...document.querySelectorAll(".d")];
  d.forEach(p => { const L = p.getTotalLength(); gsap.set(p, { strokeDasharray: p.classList.contains("f") ? "10 8" : `${L} ${L + 40}`, strokeDashoffset: p.classList.contains("f") ? 0 : L + 20 }); });
  tl.from("#t1", { x: -80, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.15);
  tl.from("#t2", { x: -60, opacity: 0, duration: 0.45, ease: "power2.out" }, 0.45);
  tl.to(d[0], { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 0.9);
  tl.to(d[1], { strokeDashoffset: 0, duration: 0.2, ease: "none" }, 1.3);
  tl.from("#m1", { opacity: 0, duration: 0.3, ease: "power1.out" }, 1.35);
  // robot parts draw one after another
  d.slice(2, 9).forEach((p, k) => tl.to(p, { strokeDashoffset: 0, duration: 0.35, ease: "power1.inOut" }, 1.5 + k * 0.17));
  tl.from(d[9], { opacity: 0, duration: 0.4, ease: "none" }, 2.4);
  d.slice(10).forEach((p, k) => tl.to(p, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 2.6 + k * 0.2));
  tl.from(["#m2", "#m3", "#m4"], { opacity: 0, x: 20, duration: 0.3, stagger: 0.18, ease: "power2.out" }, 2.8);
  tl.from("#note", { clipPath: "inset(0 100% 0 0)", duration: 0.7, ease: "power3.inOut" }, 3.4);
  tl.from("#stamp", { scale: 2.2, opacity: 0, rotation: -12, duration: 0.3, ease: "back.out(2)" }, 4.5);
  tl.to("#note", { boxShadow: "0 0 0 10px rgba(255,207,92,.25)", duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, 4.9);
  // ambient: slow pan across the sheet
  tl.fromTo(".cam", { x: 0, y: 0 }, { x: -30, y: -40, duration: 6, ease: "none" }, 0);
  tl.to({}, { duration: 6 }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["s05"] = tl;
</script>
</body>
</html>
