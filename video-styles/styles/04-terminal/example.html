<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../_shared/fonts/fonts.css">
<link rel="stylesheet" href="../../_shared/shared.css">
<style>
  /* 04 Terminal — phosphor green, typed lines, scanlines (DESIGN.md §04) */
  .stage { background: #0C0F0A; }
  .cam { position: absolute; inset: 0; }
  .glow { text-shadow: 0 0 12px rgba(57,255,106,.55), 0 0 2px rgba(57,255,106,.9); }
  #t1 { position: absolute; left: 90px; top: 250px; font: 700 128px/1.05 "IBM Plex Sans Thai"; color: #39FF6A; }
  #t2 { position: absolute; left: 90px; top: 420px; font: 600 64px/1.2 "IBM Plex Sans Thai"; color: #E9F5DB; }
  #t2 .cur, .cur { display: inline-block; width: .55em; height: 1em; background: #39FF6A; vertical-align: -.12em; margin-left: 8px; }
  #win { position: absolute; left: 60px; right: 60px; top: 640px; height: 960px; border: 3px solid #1F5130; border-radius: 6px; background: #070906; }
  #bar { height: 64px; border-bottom: 3px solid #1F5130; display: flex; align-items: center; padding: 0 26px; gap: 16px; font: 600 28px "IBM Plex Mono"; color: #3E8E57; }
  #bar i { width: 18px; height: 18px; border: 3px solid #3E8E57; display: inline-block; }
  #lines { padding: 34px 40px; font: 400 42px/1.8 "IBM Plex Mono", "IBM Plex Sans Thai"; color: #E9F5DB; }
  .ln { white-space: nowrap; clip-path: inset(0 100% 0 0); }
  .p { color: #39FF6A; } .dim { color: #6E8F74; } .warn { color: #FFB000; }
  #note { margin-top: 26px; border-left: 8px solid #39FF6A; padding: 18px 0 18px 30px; font: 700 84px/1.35 "IBM Plex Sans Thai"; color: #39FF6A; }
  #prog { display: inline-block; width: 420px; height: 30px; border: 2px solid #39FF6A; vertical-align: -4px; position: relative; }
  #prog i { position: absolute; left: 3px; top: 3px; bottom: 3px; width: calc(100% - 6px); background: #39FF6A; transform-origin: left; }
  .scan { position: absolute; inset: 0; pointer-events: none; z-index: 50;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 5px); }
  .vig { position: absolute; inset: 0; z-index: 51; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.6) 100%); }
</style>
</head>
<body>
<div class="stage" data-composition-id="s04" data-start="0" data-duration="6" data-width="1080" data-height="1920">
  <div class="cam">
    <div id="t1" class="glow ln">AI เขียนโน้ต</div>
    <div id="t2" class="ln">ถึงตัวเองในอนาคต<span class="cur" id="cur1"></span></div>
    <div id="win">
      <div id="bar"><i></i><i></i><i></i><span>claude — session — 200k</span></div>
      <div id="lines">
        <div class="ln" id="l1"><span class="p">~/project ❯</span> /compact</div>
        <div class="ln dim" id="l2">▸ context  198,431 / 200,000 tokens</div>
        <div class="ln" id="l3"><span class="warn">▸ compacting</span> <span id="prog"><i></i></span></div>
        <div class="ln dim" id="l4"># NOTE TO FUTURE SELF</div>
        <div id="note" class="glow"><div class="ln" id="n1">บอกความจริง</div><div class="ln" id="n2">เฉพาะตอนถูกถาม<span class="cur" id="cur2"></span></div></div>
      </div>
    </div>
  </div>
  <div class="scan"></div><div class="vig"></div>
  <div class="label"><b>04</b>Terminal</div>
</div>
<script src="../../_shared/gsap.min.js"></script>
<script>
  const tl = gsap.timeline({ paused: true });
  // "typing" = stepped clip reveal (keeps Thai vowels/tones attached to their letters)
  const type = (el, at, dur, n) => tl.to(el, { clipPath: "inset(0 0% 0 0)", duration: dur, ease: `steps(${n})` }, at);
  type("#t1", 0.15, 0.5, 10);
  type("#t2", 0.7, 0.55, 14);
  tl.from("#win", { scaleY: 0, transformOrigin: "50% 0%", duration: 0.35, ease: "power3.out" }, 1.25);
  type("#l1", 1.6, 0.4, 9);
  type("#l2", 2.05, 0.15, 1);
  type("#l3", 2.3, 0.1, 1);
  tl.from("#prog i", { scaleX: 0, duration: 0.7, ease: "steps(12)" }, 2.4);
  type("#l4", 3.15, 0.3, 8);
  type("#n1", 3.5, 0.45, 10);
  type("#n2", 4.0, 0.55, 13);
  // emphasis + ambient: the note flashes once, cursors blink, the screen breathes
  tl.fromTo("#note", { backgroundColor: "rgba(57,255,106,0)" }, { backgroundColor: "rgba(57,255,106,.16)", duration: 0.12, yoyo: true, repeat: 3, ease: "none" }, 4.7);
  tl.to(".cur", { opacity: 0, duration: 0.01, yoyo: true, repeat: 11, repeatDelay: 0.24, ease: "none" }, 0.2);
  tl.fromTo(".cam", { scale: 1.0 }, { scale: 1.03, duration: 6, ease: "none" }, 0);
  tl.to({}, { duration: 6 }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines["s04"] = tl;
</script>
</body>
</html>
