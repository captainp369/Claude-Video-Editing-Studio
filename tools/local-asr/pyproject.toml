[project]
name = "local-asr"
version = "0.1.0"
description = "Local Thai/English transcription that writes Scribe-compatible JSON"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=4.48",
    "accelerate",
    "safetensors",
    "huggingface_hub",
    "soundfile",
    "numpy",
    "pythainlp>=5.0",
    "rapidfuzz",
]

[tool.uv]
package = false
